name: Release Validation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  validate:
    name: Verify Plugin Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify plugin exists
        run: |
          test -f sync.plugin || (echo "sync.plugin missing" && exit 1)
          test -f zwylib.plugin || (echo "zwylib.plugin missing" && exit 1)
          echo "All plugin binaries verified successfully!"
