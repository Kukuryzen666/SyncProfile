server {
    listen 80;
    server_name sync.efn.mom;

    # Автоматический редирект на HTTPS (будет настроен Certbot)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name sync.efn.mom;

    # SSL сертификаты от Let's Encrypt (Certbot)
    ssl_certificate /etc/letsencrypt/live/sync.efn.mom/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.efn.mom/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Оптимизация и безопасность
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Основной прокси на бэкенд SyncProfile
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # Заголовки для передачи реального IP клиента и хоста
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Передача и сохранение Cookies
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # WebSocket / Keep-Alive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Лимит размера тела запроса (10MB)
        client_max_body_size 10M;
    }
}
