version: '3.8'

services:
  syncprofile-server:
    build: .
    container_name: syncprofile_server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - SYNC_DB_PATH=/app/data/sync_profiles.db
      - SYNC_AUTH_KEY=  # Опционально: укажите секретный ключ
    volumes:
      - ./data:/app/data
