server_names_hash_bucket_size 64;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers on;
ssl_session_timeout 1d;
ssl_session_cache shared:MozSSL:10m;
ssl_session_tickets off;

# -----------------------------------------------------------------------------
# 1. EFN License Gateway (Шлюз проверки HWID и Heartbeat)
# -----------------------------------------------------------------------------
server {
    server_name checklic.efn.mom;
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol;
    http2 on;

    set_real_ip_from unix:;
    real_ip_header proxy_protocol;

    ssl_certificate "/etc/nginx/ssl/efn.mom/fullchain.pem";
    ssl_certificate_key "/etc/nginx/ssl/efn.mom/privkey.pem";
    ssl_trusted_certificate "/etc/nginx/ssl/efn.mom/fullchain.pem";

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    # Защитные заголовки
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        # Поддержка WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# -----------------------------------------------------------------------------
# 2. Hana
# -----------------------------------------------------------------------------
server {
    server_name hana.efn.mom;
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol;
    http2 on;

    set_real_ip_from unix:;
    real_ip_header proxy_protocol;

    ssl_certificate "/etc/nginx/ssl/efn.mom/fullchain.pem";
    ssl_certificate_key "/etc/nginx/ssl/efn.mom/privkey.pem";
    ssl_trusted_certificate "/etc/nginx/ssl/efn.mom/fullchain.pem";

    root /var/www/html;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    location / {
        try_files $uri $uri/ =404;
    }
}

# -----------------------------------------------------------------------------
# 3. Billing
# -----------------------------------------------------------------------------
server {
    server_name billing.efn.mom;
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol;
    http2 on;

    set_real_ip_from unix:;
    real_ip_header proxy_protocol;

    ssl_certificate "/etc/nginx/ssl/efn.mom/fullchain.pem";
    ssl_certificate_key "/etc/nginx/ssl/efn.mom/privkey.pem";
    ssl_trusted_certificate "/etc/nginx/ssl/efn.mom/fullchain.pem";

    location /webhook {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webapp {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# -----------------------------------------------------------------------------
# 4. SyncProfile (Синхронизация профилей AyuGram / exteraGram)
# -----------------------------------------------------------------------------
server {
    server_name sync.efn.mom;
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol;
    http2 on;

    set_real_ip_from unix:;
    real_ip_header proxy_protocol;

    ssl_certificate "/etc/nginx/ssl/efn.mom/fullchain.pem";
    ssl_certificate_key "/etc/nginx/ssl/efn.mom/privkey.pem";
    ssl_trusted_certificate "/etc/nginx/ssl/efn.mom/fullchain.pem";

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;

    # Защитные заголовки
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Поддержка и беспрепятственный проброс Cookies
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        # Поддержка WebSocket / Upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 10M;
    }
}

# -----------------------------------------------------------------------------
# 5. Default Drop Server
# -----------------------------------------------------------------------------
server {
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol default_server;
    server_name _;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    ssl_reject_handshake on;
    return 444;
}
